services:
  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      RQA_CORS_ORIGINS: ${RQA_CORS_ORIGINS:-http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped
